<!-- Universal Navigation Header Layout for OgirimaObey.com -->
<header class="global-navigation-bar">
    
    <!-- Left Side: Brand Signature Block with Integrated Photo Asset -->
    <a href="index.html" class="nav-branding">
        <img src="images/WhatsApp Image 2026-05-27 at 03.47.04.jpeg" alt="Ogirima Obey Circle Profile" class="nav-brand-avatar">
        <span class="nav-brand-text">OGIRIMA <span class="nav-accent">OBEY</span></span>
    </a>
    
    <!-- Center: Multi-page Dynamic Links -->
    <nav class="nav-links-row" id="universal-nav-links">
        <a href="index.html" class="nav-item-link">Home</a>
        <a href="about.html" class="nav-item-link">About</a>
        <a href="books.html" class="nav-item-link">Books</a>
    </nav>

    <!-- Right Side: High-Impact Booking Call-to-Action -->
    <a href="https://wa.me/2349025643150" target="_blank" class="nav-booking-action-btn">
        Booking Inquiries
    </a>

    <!-- Embedded Scope-Specific Style System (No external file bloat) -->
    <style>
        .global-navigation-bar {
            background-color: #000000;
            color: #FFFFFF;
            width: 100%;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            border-bottom: 1px solid #1A1A1A;
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .nav-branding {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #FFFFFF;
            transition: opacity 0.2s ease;
        }

        .nav-branding:hover {
            opacity: 0.9;
        }

        .nav-brand-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #E04A33;
        }

        .nav-brand-text {
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-accent {
            color: #E04A33;
        }

        .nav-links-row {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-item-link {
            color: #FFFFFF;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
            padding: 6px 0;
            position: relative;
        }

        .nav-item-link:hover,
        .nav-item-link.nav-active {
            color: #E04A33;
        }

        /* Minimal high-end underscore indicator for active state laptop view */
        .nav-item-link.nav-active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #E04A33;
        }

        .nav-booking-action-btn {
            background-color: #E04A33;
            color: #FFFFFF;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .nav-booking-action-btn:hover {
            background-color: #c23b25;
        }

        .nav-booking-action-btn:active {
            transform: scale(0.98);
        }

        /* Laptop-Fitted Balanced Layout Adjustments Override */
        @media (min-width: 768px) {
            .global-navigation-bar {
                flex-direction: row;
                gap: 0;
                padding: 16px 40px;
            }

            .nav-brand-text {
                font-size: 20px;
            }

            .nav-links-row {
                gap: 40px;
            }

            .nav-booking-action-btn {
                width: auto;
                padding: 12px 28px;
                font-size: 12px;
            }
        }
    </style>

    <!-- Inline Active Route Evaluator Engine -->
    <script>
        (function() {
            document.addEventListener("DOMContentLoaded", function() {
                const currentPath = window.location.pathname.split("/").pop() || "index.html";
                const navLinks = document.querySelectorAll("#universal-nav-links .nav-item-link");
                navLinks.forEach(link => {
                    const hrefTarget = link.getAttribute("href");
                    if (hrefTarget === currentPath) {
                        link.classList.add("nav-active");
                    } else {
                        link.classList.remove("nav-active");
                    }
                });
            });
        })();
    </script>
</header>
